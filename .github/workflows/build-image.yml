# LAB12: custom image is built on a GitHub-hosted runner.
# A local Docker Engine / Docker Desktop installation is NOT required.
name: LAB12 - Build and publish image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Kuriama konteinerio versija'
        required: true
        type: choice
        options:
          - v1
          - v2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download student source code
        uses: actions/checkout@v4

      - name: Verify Node.js syntax
        run: node --check app.js

      - name: Verify application HTTP endpoint (without local Docker)
        shell: bash
        run: |
          PORT=18085 node app.js > /tmp/lab12-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18085/healthz; then
              echo
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18085/api/info

      - name: Normalize GHCR image owner to lowercase
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Enable Docker Buildx in GitHub runner
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish custom image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/lab12-web:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kauno kolegija LAB12 AKS student demo
