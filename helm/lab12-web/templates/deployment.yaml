apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab12-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: lab12-web
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.hpa.minReplicas }}
  selector:
    matchLabels:
      app: lab12-web
  template:
    metadata:
      labels:
        app: lab12-web
    spec:
      containers:
        - name: lab12-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_OWNER
              value: {{ .Values.app.owner | quote }}
            - name: APP_TITLE
              value: {{ .Values.app.title | quote }}
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}
            - name: APP_COLOR
              value: {{ .Values.app.color | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
