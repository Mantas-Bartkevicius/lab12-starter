# LAB12: ONE application, ONE Deployment, ONE public Service, ONE HPA.
# Student: replace PAKEISKITE_ACR and VARDAS_PAVARDE before deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab12-web
  namespace: lab12
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab12-web
  template:
    metadata:
      labels:
        app: lab12-web
    spec:
      containers:
        - name: lab12-web
          image: acrlab12rx6754wyqla2c.azurecr.io/lab12-web:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_OWNER
              value: "Mantas Bartukas"
            - name: APP_TITLE
              value: "Mano AKS keptuvė"
            - name: APP_VERSION
              value: "V1"
            - name: APP_COLOR
              value: "#2563eb"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab12-web
  namespace: lab12
spec:
  type: LoadBalancer
  selector:
    app: lab12-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab12-web
  namespace: lab12
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab12-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 90
